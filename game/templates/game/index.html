{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ game_title|title }}</title>
    <link rel="stylesheet" href="{% static 'game/style.css' %}">
</head>

<body>
    <div class="wrap">
        <h1>{{ game_title|upper }}</h1>
        <p>{{ player_x }} vs {{ player_o }}</p>

        {% if instructions %}
        <ul class="instructions">
            {% for step in instructions %}
            <li>{{ forloop.counter }}. {{ step }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <div id="status">{{ player_x }}'s turn</div>
        <div class="board" id="board"></div>
        <button id="reset">Restart</button>
    </div>

    <script>
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const resetBtn = document.getElementById('reset');
        let board = Array(9).fill(null);
        let current = 'X';
        let gameOver = false;
        const wins = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];

        function renderBoard() {
            boardEl.innerHTML = '';
            board.forEach((val, i) => {
                const btn = document.createElement('button');
                btn.className = 'cell' + (val ? ' ' + val.toLowerCase() : '');
                btn.textContent = val || '';
                btn.disabled = !!val || gameOver;
                btn.addEventListener('click', () => makeMove(i));
                boardEl.appendChild(btn);
            });
        }
        function checkWinner() {
            for (const [a, b, c] of wins) {
                if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a];
            }
            if (board.every(cell => cell)) return 'draw';
            return null;
        }
        function makeMove(i) {
            if (board[i] || gameOver) return;
            board[i] = current;
            const result = checkWinner();
            if (result) {
                gameOver = true;
                statusEl.textContent = result === 'draw' ? "It's a draw!" : `Player ${result} wins!`;
            } else {
                current = current === 'X' ? 'O' : 'X';
                statusEl.textContent = `Player ${current}'s turn`;
            }
            renderBoard();
        }
        resetBtn.addEventListener('click', () => {
            board = Array(9).fill(null);
            current = 'X';
            gameOver = false;
            statusEl.textContent = "Player X's turn";
            renderBoard();
        });
        renderBoard();
    </script>
</body>

</html>
